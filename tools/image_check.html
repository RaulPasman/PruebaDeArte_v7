<!doctype html><meta charset="utf-8"><title>Prueba de Arte — verificador de imágenes</title><style>body{font:15px system-ui;margin:30px;max-width:1000px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.ok{color:green}.bad{color:#b00}progress{width:180px}</style><h1>Verificador de imágenes</h1><p>Abierto desde la carpeta del proyecto. Comprueba las 60 URLs desde tu navegador y muestra dimensiones reales.</p><p id="summary">Cargando…</p><table><thead><tr><th>ID</th><th>Obra</th><th>Estado</th><th>Dimensiones</th></tr></thead><tbody id="rows"></tbody></table><script>
(async()=>{const works=await fetch('../data/artworks.json').then(r=>r.json());let ok=0;const rows=document.querySelector('#rows');for(const w of works){const tr=document.createElement('tr');tr.innerHTML=`<td>${w.ID}</td><td>${w.Título}</td><td>probando…</td><td>—</td>`;rows.appendChild(tr);await new Promise(res=>{const im=new Image();let done=false;const finish=(good)=>{if(done)return;done=true;if(good){ok++;tr.children[2].innerHTML='<span class="ok">OK</span>';tr.children[3].textContent=im.naturalWidth+' × '+im.naturalHeight}else{tr.children[2].innerHTML='<span class="bad">ERROR</span>'}res()};im.onload=()=>finish(im.naturalWidth>=1200);im.onerror=()=>finish(false);im.src=w.image_url;setTimeout(()=>finish(false),12000)});document.querySelector('#summary').textContent=`${ok} / ${works.length} imágenes pasan el mínimo de 1200 px.`}})();</script>
